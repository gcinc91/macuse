[package]
name = "macuse"
version = "0.1.0"
edition = "2021"
description = "Natural scrolling per-device toggle for macOS (trackpad + mouse independent)"
license = "MIT"

[[bin]]
name = "macuse"
path = "src/main.rs"

[dependencies]
cocoa = "0.25"
objc = "0.2"
core-graphics = "0.25"
core-foundation = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
anyhow = "1"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
